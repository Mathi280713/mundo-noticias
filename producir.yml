name: Producir bucle de Mundo Noticias
on:
  schedule:
    - cron: '5 * * * *'      # cada hora (hora UTC); ajuste a gusto
  workflow_dispatch:
    inputs:
      minutos: {description: 'Duración del bucle en minutos (vacío = automática)', required: false}
concurrency: {group: producir, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with: {path: voz, key: voz-davefx-v1}
      - run: bash scripts/instalar_voz.sh
      - name: Producir
        run: python3 main.py producir --estado estado --salida salida --minutos "${{ github.event.inputs.minutos || 55 }}"
      - uses: actions/upload-artifact@v4
        with: {name: bucle, path: "salida/bucle.mp4\nsalida/creditos.txt\nsalida/lista.json", retention-days: 3}
      - name: Guardar estado (noticias ya usadas y salud de fuentes)
        run: |
          git config user.name "mundo-noticias-bot"; git config user.email "bot@users.noreply.github.com"
          git add estado/estado.json estado/salud_fuentes.json || true
          git commit -m "Estado del programa" || echo "sin cambios"; git push || true
